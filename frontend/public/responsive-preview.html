<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CampusBridge · 移动端验收预览</title>
<style>body{margin:0;padding:18px 16px;background:#edf0f6;color:#374260;font:12px "Segoe UI","Microsoft YaHei",sans-serif}header{width:390px;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:13px}header span{color:#8990aa}iframe{display:block;width:390px;height:844px;border:1px solid #dbe1ec;border-radius:14px;background:white;box-shadow:0 6px 24px #25335412}</style></head>
<body><header><strong>CampusBridge · 响应式验收</strong><span>390 × 844</span></header><iframe id="campus-preview" title="CampusBridge 响应式应用" src="/"></iframe>
<script>
if (new URLSearchParams(location.search).get('size') === 'desktop') {
  const frame = document.getElementById('campus-preview');
  frame.style.width = '1360px'; frame.style.height = '900px';
  frame.style.border = '0'; frame.style.borderRadius = '0'; frame.style.boxShadow = 'none';
  document.body.style.padding = '0'; document.querySelector('header').style.display = 'none';
  // Optional fit previews the same 1360x900 app viewport on a smaller display.
  if (new URLSearchParams(location.search).get('fit') === '1') {
    const fit = () => {
      const scale = Math.min(1, (innerWidth - 32) / 1360, (innerHeight - 32) / 900);
      frame.style.transformOrigin = 'top left'; frame.style.transform = `scale(${scale})`;
      frame.style.position = 'absolute'; frame.style.left = '16px'; frame.style.top = '16px';
      document.body.style.overflow = 'hidden';
    };
    addEventListener('resize', fit); fit();
  }
}
</script></body></html>
