name: CampusBridge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      CAMPUSBRIDGE_MODEL_PROVIDER: mock
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python scripts/release.py audit --root .
      - run: python scripts/verify_archive.py
      - run: python scripts/http_smoke.py --output runs/ci-http.json
      - run: python scripts/showcase_demo.py --output runs/ci-dynamic

  redis:
    runs-on: ubuntu-latest
    env:
      CAMPUSBRIDGE_MODEL_PROVIDER: mock
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -r requirements.lock -r requirements-redis.lock
      - run: python -m pip install -e . --no-deps
      - run: redis-server --version
      - run: python -m pytest tests/test_redis_d2.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
