[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusbridge"
version = "0.6.0"
description = "Original campus student-support agents with reviewed delivery and human follow-up"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "SQLAlchemy>=2.0,<2.1", "uvicorn==0.52.4", "httpx==0.28.1", "alembic==1.20.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
mysql = ["PyMySQL[rsa]==1.1.2"]
rag = ["torch==2.8.0", "transformers==4.57.1", "numpy==2.2.6", "psutil==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campusbridge = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
